[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-factory"
version = "0.1.0"
description = "Python framework for creating and managing AI agents"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-ai>=0.1.0",
    "langfuse>=0.1.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
agents-factory = "agents_factory.cli:init"