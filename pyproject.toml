[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-factory"
version = "0.1.0"
description = "Python framework for creating and managing AI agents"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "PyYAML",
    "python-dotenv",
]

[project.scripts]
agents-factory = "agents_factory.main:create_pipeline"
